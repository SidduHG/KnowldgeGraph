services:
  mysql:
    image: mysql:8.0
    container_name: ckg_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ckg
      MYSQL_USER: ckg_user
      MYSQL_PASSWORD: ckg_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ckg_user", "-pckg_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ckg_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - "${USERPROFILE}:/repo:ro"

  mcp_server:
    build: ./mcp_server
    container_name: ckg_mcp
    ports:
      - "8001:8001"
    env_file:
      - ./mcp_server/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MODE: http
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - "${USERPROFILE}:/repo:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
